<rect x="20" y="20" width="280" height="184" rx="12" fill="none" stroke="#ffb02e" opacity="0"><animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.5;1" dur="3s" begin="0.0s" repeatCount="indefinite"/></rect>
<text x="38" y="50" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#ffb02e">CASE 01</text>
<text x="282" y="50" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.5" fill="#4be3c6">PYTHON</text>
<text x="38" y="86" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="26" fill="#ece8df">Packet Tracker</text>
<text x="38" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8a8a94">Captures packets in Wireshark,</text>
<text x="38" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8a8a94">pins their IPs on Google Maps.</text>
<text x="38" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8a8a94">Everyone is somewhere. Now cited.</text>
<circle cx="278" cy="184" r="3" fill="#4be3c6"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" begin="0.0s" repeatCount="indefinite"/></circle><text x="268" y="188" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="1.5" fill="#8a8a94">PUBLIC</text>
</g></g>
<g><animateTransform attributeName="transform" type="translate" values="0 14;0 0;0 0;0 14" keyTimes="0;0.06;0.92;1" dur="12s" begin="0.25s" repeatCount="indefinite"/><g><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.92;1" dur="12s" begin="0.25s" repeatCount="indefinite"/>
<rect x="310" y="20" width="280" height="184" rx="12" fill="#12141a" stroke="#fff" stroke-opacity="0.1"/>
<rect x="310" y="20" width="280" height="184" rx="12" fill="none" stroke="#ffb02e" opacity="0"><animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.5;1" dur="3s" begin="0.6s" repeatCount="indefinite"/></rect>
<text x="328" y="50" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#ffb02e">CASE 02</text>
<text x="572" y="50" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.5" fill="#4be3c6">PYTHON</text>
<text x="328" y="86" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="26" fill="#ece8df">Face Attendance</text>
<text x="328" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8a8a94">Your face is now your timecard.</text>
<text x="328" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8a8a94">Anti-spoofing included, so no,</text>
<text x="328" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8a8a94">you cannot send a photo instead.</text>
<circle cx="568" cy="184" r="3" fill="#4be3c6"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" begin="0.3s" repeatCount="indefinite"/></circle><text x="558" y="188" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="1.5" fill="#8a8a94">PUBLIC</text>
</g></g>
<g><animateTransform attributeName="transform" type="translate" values="0 14;0 0;0 0;0 14" keyTimes="0;0.06;0.92;1" dur="12s" begin="0.5s" repeatCount="indefinite"/><g><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.92;1" dur="12s" begin="0.5s" repeatCount="indefinite"/>
<rect x="600" y="20" width="280" height="184" rx="12" fill="#12141a" stroke="#fff" stroke-opacity="0.1"/>
<rect x="600" y="20" width="280" height="184" rx="12" fill="none" stroke="#ffb02e" opacity="0"><animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.5;1" dur="3s" begin="1.2s" repeatCount="indefinite"/></rect>
<text x="618" y="50" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#ffb02e">CASE 03</text>
<text x="862" y="50" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.5" fill="#4be3c6">PYTHON</text>
<text x="618" y="86" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="26" fill="#ece8df">Patch Triage</text>
<text x="618" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8a8a94">Decides which vulnerability gets</text>
<text x="618" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8a8a94">fixed first. Triage, but for</text>
<text x="618" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8a8a94">software. Fewer tears.</text>
<circle cx="858" cy="184" r="3" fill="#4be3c6"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" begin="0.6s" repeatCount="indefinite"/></circle><text x="848" y="188" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="1.5" fill="#8a8a94">PUBLIC</text>
</g></g>
<g><animateTransform attributeName="transform" type="translate" values="0 14;0 0;0 0;0 14" keyTimes="0;0.06;0.92;1" dur="12s" begin="0.75s" repeatCount="indefinite"/><g><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.92;1" dur="12s" begin="0.75s" repeatCount="indefinite"/>
<rect x="165" y="226" width="280" height="184" rx="12" fill="#12141a" stroke="#fff" stroke-opacity="0.1"/>
<rect x="165" y="226" width="280" height="184" rx="12" fill="none" stroke="#ffb02e" opacity="0"><animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.5;1" dur="3s" begin="1.7999999999999998s" repeatCount="indefinite"/></rect>
<text x="183" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#ffb02e">CASE 04</text>
<text x="427" y="256" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.5" fill="#4be3c6">JUPYTER</text>
<text x="183" y="292" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="26" fill="#ece8df">Waste Management</text>
<text x="183" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8a8a94">A notebook, a report and a deck</text>
<text x="183" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8a8a94">about trash. Handled with more</text>
<text x="183" y="366" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8a8a94">ceremony than trash expects.</text>
<circle cx="423" cy="390" r="3" fill="#4be3c6"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" begin="0.8999999999999999s" repeatCount="indefinite"/></circle><text x="413" y="394" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="1.5" fill="#8a8a94">PUBLIC</text>
</g></g>
<g><animateTransform attributeName="transform" type="translate" values="0 14;0 0;0 0;0 14" keyTimes="0;0.06;0.92;1" dur="12s" begin="1.0s" repeatCount="indefinite"/><g><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.92;1" dur="12s" begin="1.0s" repeatCount="indefinite"/>
<rect x="455" y="226" width="280" height="184" rx="12" fill="#12141a" stroke="#fff" stroke-opacity="0.1"/>
<rect x="455" y="226" width="280" height="184" rx="12" fill="none" stroke="#ffb02e" opacity="0"><animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.5;1" dur="3s" begin="2.4s" repeatCount="indefinite"/></rect>
<text x="473" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#ffb02e">CASE 05</text>
<text x="717" y="256" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.5" fill="#4be3c6">JUPYTER</text>
<text x="473" y="292" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="26" fill="#ece8df">Face Detection</text>
<text x="473" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8a8a94">Finds faces. Does not learn names.</text>
<text x="473" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8a8a94">That was the other repo's job.</text>
<text x="473" y="366" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8a8a94">Division of labor.</text>
<circle cx="713" cy="390" r="3" fill="#4be3c6"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" begin="1.2s" repeatCount="indefinite"/></circle><text x="703" y="394" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="1.5" fill="#8a8a94">PUBLIC</text>
</g></g>
