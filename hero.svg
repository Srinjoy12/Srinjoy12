<text x="44" y="256" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-style="italic" fill="url(#sh)">Roy</text>
<text x="208" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2" fill="#8a8a94">SOFTWARE ENGINEER</text>
<line x1="208" y1="262" x2="344" y2="262" stroke="#ffb02e" stroke-width="1.5"/>
<text x="48" y="312" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8a8a94">$ whoami --honest</text>
<text x="48" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" fill="#ece8df" opacity="0">&gt; Taught a computer to take attendance. Face first.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0005;0.0150;0.1467;0.1617;1.0000" dur="24s" repeatCount="indefinite"/></text>
<text x="48" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" fill="#ece8df" opacity="0">&gt; Built a map that shows where packets live.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1667;0.1817;0.3133;0.3283;1.0000" dur="24s" repeatCount="indefinite"/></text>
<text x="48" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" fill="#ece8df" opacity="0">&gt; 97.23% at spotting fakes. Working on myself.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3333;0.3483;0.4800;0.4950;1.0000" dur="24s" repeatCount="indefinite"/></text>
<text x="48" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" fill="#ece8df" opacity="0">&gt; Ran a hacking contest for people who catch hackers.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5000;0.5150;0.6467;0.6617;1.0000" dur="24s" repeatCount="indefinite"/></text>
<text x="48" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" fill="#ece8df" opacity="0">&gt; Prioritized patches. Sleep did not make the list.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6667;0.6817;0.8133;0.8283;1.0000" dur="24s" repeatCount="indefinite"/></text>
<text x="48" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" fill="#ece8df" opacity="0">&gt; Makes audit software fast. Auditors remain calm.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8333;0.8483;0.9800;0.9950;1.0000" dur="24s" repeatCount="indefinite"/></text>
<line x1="48" y1="382" x2="852" y2="382" stroke="#fff" stroke-opacity="0.1"/>
