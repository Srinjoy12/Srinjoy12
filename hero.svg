<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Srinjoy Roy, software engineer">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" opacity="0.07"/>
    </pattern>
    <linearGradient id="fadeR" x1="0" x2="1">
      <stop offset="0" stop-color="#111214" stop-opacity="0"/>
      <stop offset="1" stop-color="#111214" stop-opacity="0"/>
    </linearGradient>
    <path id="main" d="M520 215 C 590 215, 600 120, 670 130 S 770 190, 840 70"/>
  </defs>

  <rect width="900" height="300" rx="14" fill="#111214"/>
  <rect width="900" height="300" rx="14" fill="url(#dots)"/>

  <!-- ghost trajectories: many paths, one of them is "you" -->
  <g fill="none" stroke="#e8e4da" stroke-opacity="0.13" stroke-width="1.2" stroke-linecap="round">
    <path d="M520 215 C 590 215, 610 170, 680 175 S 780 200, 840 150"/>
    <path d="M520 215 C 580 215, 600 190, 670 205 S 770 160, 840 190"/>
    <path d="M520 215 C 600 215, 590 100, 670 100 S 780 130, 840 110"/>
    <path d="M520 215 C 570 215, 620 230, 680 225 S 780 240, 840 225"/>
    <path d="M520 215 C 590 215, 620 140, 680 150 S 770 120, 840 130"/>
  </g>

  <!-- the one that matters -->
  <use href="#main" fill="none" stroke="#ffb02e" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="420" stroke-dashoffset="420">
    <animate attributeName="stroke-dashoffset" values="420;0;0;420" keyTimes="0;0.4;0.9;1" dur="9s" repeatCount="indefinite"/>
  </use>
  <circle r="5" fill="#ffb02e">
    <animateMotion dur="9s" repeatCount="indefinite" keyPoints="0;1;1;0" keyTimes="0;0.4;0.9;1" calcMode="linear"><mpath href="#main"/></animateMotion>
  </circle>
  <circle r="12" fill="#ffb02e" opacity="0.18">
    <animateMotion dur="9s" repeatCount="indefinite" keyPoints="0;1;1;0" keyTimes="0;0.4;0.9;1" calcMode="linear"><mpath href="#main"/></animateMotion>
  </circle>
  <circle cx="520" cy="215" r="3.5" fill="#e8e4da"/>

  <!-- type -->
  <text x="48" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="3" fill="#ffb02e">SOFTWARE ENGINEER</text>
  <text x="46" y="148" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-style="italic" fill="#f3efe6">Srinjoy Roy</text>
  <text x="48" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#a9a69d">Full-stack and cloud at Deloitte USI.</text>
  <text x="48" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#a9a69d">Applied ML and security on the side.</text>
  <line x1="48" y1="244" x2="120" y2="244" stroke="#ffb02e" stroke-width="2"/>
</svg>
