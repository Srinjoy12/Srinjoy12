<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="Five public repositories presented as case files">
<defs><clipPath id="rc"><rect width="900" height="430" rx="16"/></clipPath><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" opacity="0.05"/></pattern><linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4be3c6" stop-opacity="0"/><stop offset="0.85" stop-color="#4be3c6" stop-opacity="0.22"/><stop offset="1" stop-color="#4be3c6" stop-opacity="0.9"/></linearGradient></defs><g clip-path="url(#rc)"><rect width="900" height="430" fill="#0a0b0f"/><rect width="900" height="430" fill="url(#dots)"/>
<g><animateTransform attributeName="transform" type="translate" values="0 14;0 0;0 0;0 14" keyTimes="0;0.06;0.92;1" dur="12s" begin="0.0s" repeatCount="indefinite"/><g><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.92;1" dur="12s" begin="0.0s" repeatCount="indefinite"/>
